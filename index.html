<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universe 2026 Announcements</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; background: #0d1117; color: #e6edf3; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: .3rem; }
    article { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: .75rem 1rem; margin: .5rem 0; }
    h3 { margin: 0 0 .25rem; font-size: 1rem; }
    p { margin: 0; color: #9da7b3; }
  </style>
</head>
<body>
  <h1>GitHub Universe 2026</h1>
  <div id="app">Loading…</div>
  <script type="module">
    import { render } from "./src/render.js";
    const data = await (await fetch("./src/announcements.json")).json();
    document.getElementById("app").innerHTML = render(data);
  </script>
</body>
</html>
